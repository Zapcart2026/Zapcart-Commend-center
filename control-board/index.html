<style>
/* Dense operations panel: one scannable line per item, detail on tap, buttons always reachable. */
:root{
  --bg:#f3f5f8; --surface:#fff; --sunk:#e8ecf2; --ink:#0f141a; --dim:#5a6672; --line:#d6dde6;
  --accent:#0b4fd8; --accent-ink:#fff;
  --now:#c0271e; --urgent:#b4540a; --high:#0b4fd8; --decision:#6a3fb5; --ok:#0b7a45;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e13; --surface:#131a22; --sunk:#1b232d; --ink:#e8eef5; --dim:#93a1b1; --line:#242e3a;
  --accent:#5e95ff; --accent-ink:#06101f;
  --now:#ff7066; --urgent:#f0a046; --high:#5e95ff; --decision:#b28cf5; --ok:#4ac486;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e13; --surface:#131a22; --sunk:#1b232d; --ink:#e8eef5; --dim:#93a1b1; --line:#242e3a;
  --accent:#5e95ff; --accent-ink:#06101f;
  --now:#ff7066; --urgent:#f0a046; --high:#5e95ff; --decision:#b28cf5; --ok:#4ac486;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--surface)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:8px;display:flex;align-items:center;gap:9px}
.mk{width:22px;height:22px;flex:0 0 auto;border-radius:5px;object-fit:contain}
.nm{font-weight:700;font-size:14px;letter-spacing:-.01em;margin:0;flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pip{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.pip.on{background:var(--ok)}
.pip.bad{background:var(--urgent)}
@media (prefers-reduced-motion:no-preference){.pip.on{animation:bl 2.4s ease-in-out infinite}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.ico{appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);
  width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:13px;flex:0 0 auto;line-height:1}
.ico:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* filter strip */
.strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:7px;border-bottom:1px solid var(--line);background:var(--surface)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;cursor:pointer;min-height:26px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip b{font-family:var(--mono);margin-left:4px;opacity:.75}

.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:8px 32px;max-width:820px;margin-inline:auto}

/* one dense row */
.r{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:8px;margin-bottom:5px;overflow:hidden}
.r.now{border-left-color:var(--now)} .r.urgent{border-left-color:var(--urgent)}
.r.high{border-left-color:var(--high)} .r.decision{border-left-color:var(--decision)}
.r.done{opacity:.5}
.hd{display:flex;align-items:baseline;gap:8px;padding:8px 10px;cursor:pointer}
.hd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.t{flex:1 1 auto;min-width:0;font-weight:600;font-size:13.5px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.age{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.sub{padding:0 10px 7px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx{padding:0 10px 8px;font-size:12.5px;color:var(--dim)}
.nx b{color:var(--ink);font-weight:600}
.body{padding:0 10px 9px;font-size:13px;color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere;
  border-top:1px dashed var(--line);margin-top:2px;padding-top:8px}
.bar{display:flex;gap:5px;flex-wrap:wrap;padding:0 10px 9px}
.b{appearance:none;border:1px solid var(--line);background:var(--sunk);color:var(--ink);
  font:500 12px var(--sans);padding:6px 11px;border-radius:7px;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;min-height:34px}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.b.ok{border-color:var(--ok);color:var(--ok)}
.menu{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 5px);z-index:6;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.28);padding:4px;min-width:160px}
.pop button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;
  color:var(--ink);font:400 12.5px var(--sans);padding:8px 10px;border-radius:6px;cursor:pointer}
.pop button:hover,.pop button:focus-visible{background:var(--sunk);outline:none}

.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  margin:14px 0 6px;font-weight:600}
.sec:first-child{margin-top:2px}
.rest{color:var(--dim);font-size:13px;padding:26px 6px;text-align:center}
.rest b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.warn{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--urgent);
  border-radius:8px;padding:9px 11px;color:var(--dim);font-size:12.5px;margin-bottom:6px}
.q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font:14px var(--sans);margin-bottom:7px}
.q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.p{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--high);
  border-radius:8px;margin-bottom:5px;padding:8px 10px}
.p.hold{border-left-color:var(--now)}
.p .pn{font-family:var(--mono);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.p .ds{font-size:12px;color:var(--dim);margin:2px 0 4px;overflow-wrap:anywhere}
.p .sp{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.p .mg{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-family:var(--mono);font-size:11px}
.p .mg b{color:var(--ink);font-weight:600}
.p .cost{color:var(--ok);font-weight:600}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  padding:1px 5px;border-radius:3px;border:1px solid var(--now);color:var(--now);margin-left:5px}
/* records */
.r.sup{border-left-color:var(--high)} .r.cus{border-left-color:var(--ok)} .r.bad{border-left-color:var(--now)}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
.rb{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px;font-weight:500}
.rb.sup{border-color:var(--high);color:var(--high)} .rb.cus{border-color:var(--ok);color:var(--ok)}
.rb.bad{border-color:var(--now);color:var(--now)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:0;padding:8px 10px 9px;font-size:12.5px;
  border-top:1px dashed var(--line)}
.kv dt{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.lg{display:flex;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.lg .d{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 46px;padding-top:2px;font-variant-numeric:tabular-nums}
.lg .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--accent);flex:0 0 84px;padding-top:2px;letter-spacing:.04em;overflow-wrap:anywhere}
.lg .x{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.lg .x b{font-weight:600}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.stat span{flex:1 1 90px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat b{display:block;font:700 17px var(--sans);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:20;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 15px;border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100vw - 28px)}
</style>

<div class="top"><div class="top-in">
  <img class="mk" src="/_blob/1e8bbfa3d3031c215f645e30e555ce90" alt="" width="22" height="22">
  <p class="nm">Zapcart Control Board</p>
  <span class="sync"><span class="pip" id="pip"></span><span id="syn">connecting</span></span>
  <button class="ico" id="th" type="button" title="Lighting" aria-label="Lighting">◐</button>
</div></div>

<div class="strip" id="strip"></div>
<div class="wrap"><div id="v-price" hidden><input class="q" id="q" type="search" placeholder="Part number, brand or description…" autocomplete="off" spellcheck="false"><div id="pres"></div></div><div id="v-rec" hidden><div class="seg" id="rseg"></div><input class="q" id="rq" type="search" placeholder="Company, domain, contact or product…" autocomplete="off" spellcheck="false"><div id="rres"></div></div><div id="list"><div class="rest"><b>Loading</b>Your board appears here.</div></div></div>

<script>
(function(){
"use strict";
var RANK={"Do now":0,"Urgent":1,"High":2,"Decision":3};
var CLS={"Do now":"now","Urgent":"urgent","High":"high","Decision":"decision"};
var db=null,dl=null,watch=null,canWrite=null,rows=[],agents=[],loaded=false,agLoaded=false;
var stale=false,lastAt=null,pop=null,timer=null;
var view="do",filt="all",open={};
var cat=null,catState="idle",qv="";
var rec={tab:"co",q:"",role:"all",co:null,st:"idle",act:null,cmp:null,docs:null,setup:null,sub:false,open:{}};

/* lighting: auto -> light -> dark */
var TH=["auto","light","dark"],ti=0;
function setTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  document.getElementById("th").textContent=t==="light"?"☀":t==="dark"?"☾":"◐";
  try{localStorage.setItem("zc_th",t)}catch(e){}
}
try{var st=localStorage.getItem("zc_th");ti=Math.max(0,TH.indexOf(st));}catch(e){}
setTheme(TH[ti]);
document.getElementById("th").onclick=function(){ti=(ti+1)%3;setTheme(TH[ti])};

function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function toast(m){var o=document.querySelector(".toast");if(o)o.remove();
  var t=el("div","toast",m);document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function firstSentence(x){var t=String(x||"").trim();var i=t.indexOf(". ");
  return i>0&&i<180?t.slice(0,i+1):(t.length>180?t.slice(0,177)+"...":t)}
function wa(p){return String(p||"").replace(/[^\d]/g,"")}
function ago(iso){if(!iso)return"";var m=Math.round((Date.now()-new Date(iso).getTime())/6e4);
  if(!isFinite(m))return"";if(m<1)return"now";if(m<60)return m+"m";
  var h=Math.round(m/60);return h<24?h+"h":Math.round(h/24)+"d"}
function copy(s,w){try{navigator.clipboard.writeText(s).then(function(){toast(w+" copied")},function(){toast(s)})}
  catch(e){toast(s)}}
function lnk(c,h,x){var a=el("a","b "+c,x);a.href=h;a.target="_blank";a.rel="noopener";return a}
/* company documents: hand the real file to the device so it can be attached to the open draft */
function docOf(id){var a=rec.docs||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function savable(x){return !!(x&&x.url&&x.url.charAt(0)==="/")}
function docFile(x){if(x.file)return x.file;var ext=savable(x)?(String(x.kind||"pdf").toLowerCase()==="png"?"png":"pdf"):"";
  return (x.label||x.id)+(ext?"."+ext:"")}
function saveDoc(x){
  if(!x||!x.url)return;
  if(!dl||!savable(x)){window.open(x.url,"_blank","noopener");return}
  toast("Getting "+docFile(x)+"…");
  fetch(x.url).then(function(r){if(!r.ok)throw new Error("fetch");return r.blob()})
    .then(function(b){return dl.save({filename:docFile(x),data:b})})
    .then(function(){toast("Saved. Attach it to the draft")},
      function(e){var c=e&&e.code;if(c==="declined")return;
        toast(c==="rate_limited"?"One file at a time":"Could not save here. Open it under Records, Documents")});
}
function fileBtn(x,label){var b=el("button","b",label);b.type="button";
  b.onclick=function(ev){ev.stopPropagation();saveDoc(x)};return b}
function shut(){if(pop){pop.remove();pop=null}}
document.addEventListener("click",function(e){if(pop&&!pop.parentNode.contains(e.target))shut()});

function write(id,patch,msg){
  if(!db)return;
  if(canWrite===false){toast("View-only access");return}
  db.collection("board").doc(id).update(patch).then(
    function(){if(msg)toast(msg)},
    function(err){if(err&&err.code==="invalid_argument"){canWrite=false;draw();toast("Board is read-only for you")}
      else toast("Could not save")});
}
function hrs(h){var d=new Date();d.setTime(d.getTime()+h*36e5);return d}
function tmr(h){var d=new Date();d.setDate(d.getDate()+1);d.setHours(h,0,0,0);return d}

function row(r,isDone){
  var d=el("div","r "+(CLS[r.priority]||"high")+(isDone?" done":""));
  var hd=el("div","hd");hd.tabIndex=0;hd.setAttribute("role","button");
  hd.appendChild(el("span","t",r.title||"Untitled"));
  hd.appendChild(el("span","age",ago(r.created)||""));
  var toggle=function(){open[r.id]=!open[r.id];draw()};
  hd.onclick=toggle;
  hd.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
  d.appendChild(hd);

  var meta=[r.company,r.country,r.priority].filter(Boolean).join(" · ");
  if(meta)d.appendChild(el("div","sub",meta));

  if(!open[r.id]&&r.what){
    var one=el("div","nx");
    one.appendChild(el("b",null,"Next: "));
    one.appendChild(document.createTextNode(firstSentence(r.what)));
    d.appendChild(one);
  }
  if(open[r.id]&&r.what)d.appendChild(el("div","body",r.what));

  var bar=el("div","bar");
  if(isDone){
    var bk=el("button","b","Put back");bk.type="button";
    bk.onclick=function(){write(r.id,{status:"open",done_at:null,snooze_until:null},"Back on the board")};
    bar.appendChild(bk);d.appendChild(bar);return d;
  }
  if(r.open_url)bar.appendChild(lnk("go",r.open_url,r.open_label||"Open"));
  var ids=Array.isArray(r.files)?r.files:(typeof r.files==="string"&&r.files?[r.files]:[]);
  if(ids.length){
    var fs=[],missing=[];
    ids.forEach(function(id){var x=docOf(id);if(x&&x.url)fs.push(x);else missing.push(id)});
    if(fs.length){
      var at=el("div","nx");
      at.appendChild(el("b",null,r.files_attached?"Already attached to the draft: ":"Attach before sending: "));
      at.appendChild(document.createTextNode(fs.map(docFile).join(", ")));d.appendChild(at);
      fs.forEach(function(x){
        if(dl&&savable(x))bar.appendChild(fileBtn(x,"Save "+(x.short||x.label||x.id)));
        else bar.appendChild(lnk("",x.url,"Open "+(x.short||x.label||x.id)));
      });
    }
    if(missing.length){var mw0=el("div","nx warn");mw0.textContent="Document not on file: "+missing.join(", ")+" — open Records, Documents";d.appendChild(mw0)}
  }
  if(r.phone&&wa(r.phone))bar.appendChild(lnk("","https://wa.me/"+wa(r.phone),"WhatsApp"));
  var dn=el("button","b ok","Done");dn.type="button";
  dn.onclick=function(){write(r.id,{status:"done",done_at:new Date().toISOString()},"Done")};
  bar.appendChild(dn);

  var mw=el("span","menu");var lt=el("button","b","Later");lt.type="button";
  lt.onclick=function(ev){ev.stopPropagation();
    if(pop&&pop.parentNode===mw){shut();return}
    shut();var p=el("div","pop");
    [["1 hour",function(){return hrs(1)}],["4 hours",function(){return hrs(4)}],
     ["Tomorrow 08:00",function(){return tmr(8)}],["Tomorrow 14:00",function(){return tmr(14)}]]
    .forEach(function(o){var b=el("button",null,o[0]);b.type="button";
      b.onclick=function(){shut();write(r.id,{snooze_until:o[1]().toISOString()},"Hidden until "+o[0])};
      p.appendChild(b)});
    if(r.email){var ce=el("button",null,"Copy "+r.email);ce.type="button";
      ce.onclick=function(){shut();copy(r.email,"Address")};p.appendChild(ce)}
    if(r.site){var sl=el("button",null,"Open website");sl.type="button";
      sl.onclick=function(){shut();window.open(r.site,"_blank","noopener")};p.appendChild(sl)}
    mw.appendChild(p);pop=p};
  mw.appendChild(lt);bar.appendChild(mw);
  d.appendChild(bar);
  return d;
}

function agRow(a){
  var map={running:"high",stop:"now",create:"decision",off:""};
  var d=el("div","r "+(map[a.state]||""));
  var hd=el("div","hd");hd.tabIndex=0;hd.setAttribute("role","button");
  hd.appendChild(el("span","t",a.name||a.id));
  hd.appendChild(el("span","age",a.platform==="Claude cloud"?"cloud":a.platform==="ChatGPT"?"gpt":"pc"));
  var tg=function(){open["a"+a.id]=!open["a"+a.id];draw()};
  hd.onclick=tg;hd.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tg()}};
  d.appendChild(hd);
  d.appendChild(el("div","sub",a.status||""));
  if(open["a"+a.id]){
    if(a.role)d.appendChild(el("div","body",a.role+(a.detail?"\n\n"+a.detail:"")));
    if(a.open_url){var b=el("div","bar");b.appendChild(lnk("go",a.open_url,a.open_label||"Open"));d.appendChild(b)}
  }
  return d;
}

function money(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}

function loadCat(){
  if(catState!=="idle")return;
  catState="loading";draw();
  fetch("/_blob/3fe3f232c0cf8424f0d4f7a037c37bea")
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){cat=j;catState="ready";draw()})
    .catch(function(){catState="failed";draw()});
}

function priceRow(r){
  var d=el("div","p"+(r.hold?" hold":""));
  var pn=el("div","pn");
  pn.appendChild(document.createTextNode(r.pn||"(no part number)"));
  if(r.hold)pn.appendChild(el("span","badge","EXPORT HOLD"));
  d.appendChild(pn);
  if(r.desc)d.appendChild(el("div","ds",r.desc));
  d.appendChild(el("div","sp",[r.sup,r.cond,r.qty?"qty "+r.qty:"",r.date].filter(Boolean).join(" \u00b7 ")));
  var mg=el("div","mg");
  if(r.hold){
    mg.appendChild(el("span",null,"Export check and end-user file required before quoting."));
  }else if(r.cost){
    var c=el("span");c.appendChild(el("b",null,"Cost "));
    var cv=el("span","cost",money(r.cost));c.appendChild(cv);mg.appendChild(c);
    var b=el("span");b.appendChild(el("b",null,"Bulk 5\u201310% "));

function draw(){
  var now=Date.now(),act=[],later=[],done=[];
  rows.forEach(function(r){
    if(r.status==="done"){if(r.done_at&&now-new Date(r.done_at).getTime()<864e5)done.push(r);return}
    if(r.snooze_until&&new Date(r.snooze_until).getTime()>now){later.push(r);return}
    act.push(r);
  });
  var rk=function(r){var p=RANK[r.priority];return p==null?2:p};
  act.sort(function(a,b){return (rk(a)-rk(b))||String(b.created||"").localeCompare(String(a.created||""))});

    strip.appendChild(c);
  });

  var host=document.getElementById("list");host.replaceChildren();
  document.getElementById("v-price").hidden=view!=="price";
  document.getElementById("v-rec").hidden=view!=="rec";
  if(view==="price"){drawPrice();return}

    var order={stop:0,create:1,running:2,off:3};
    var alist=agents.slice().sort(function(a,b){

      if(g!==grp){grp=g;host.appendChild(el("div","sec",g))}

    return;
  }

  if(!loaded){host.appendChild(el("div","rest","Loading"));return}
  if(canWrite===false)host.appendChild(el("div","warn","View-only access: Done and Later will not save."));
  if(stale)host.appendChild(el("div","warn","Cannot reach the data right now; this may be out of date. Still retrying."));

  var set=filt==="now"?act.filter(function(r){return rk(r)<=1}):filt==="later"?later:filt==="done"?done:act;
  if(!set.length){
    var e=el("div","rest");
    e.appendChild(el("b",null,filt==="done"?"Nothing finished yet today":"Nothing waiting on you"));
    e.appendChild(document.createTextNode(filt==="later"?"Nothing snoozed.":"Agents add work here as they find it."));
    host.appendChild(e);return;
  }
  var g=null;
  set.forEach(function(r){
    if(filt==="all"||filt==="do"){
      var h=r.group||r.priority||"Waiting";
      if(h!==g){g=h;host.appendChild(el("div","sec",h))}
    }
    host.appendChild(row(r,filt==="done"));
  });
}

function sync(){
  var p=document.getElementById("pip"),s=document.getElementById("syn");
  if(!db){p.className="pip";s.textContent="offline";return}
  if(!loaded){p.className="pip";s.textContent="connecting";return}
  if(stale){p.className="pip bad";s.textContent="no signal";return}
  p.className="pip on";s.textContent=lastAt?ago(lastAt):"live";
}

document.getElementById("q").addEventListener("input",function(e){qv=e.target.value;drawPrice()});
document.getElementById("rq").addEventListener("input",function(e){rec.q=e.target.value;drawRec()});
draw();sync();setInterval(sync,30000);

if(!window.claude||!window.claude.use){loaded=true;agLoaded=true;stale=true;draw();sync();return}

window.claude.use("user").then(function(u){
  if(!u||!u.can)return;
  return Promise.resolve(u.can("data.write")).then(function(v){
    if(v===false){canWrite=false;draw()}else if(v===true)canWrite=true})
}).catch(function(){});

window.claude.use("downloads").then(function(s){dl=s||null;draw();if(view==="rec")drawRec()}).catch(function(){});

window.claude.use("db").then(function(s){
  db=s;
  if(!db){loaded=true;agLoaded=true;stale=true;draw();sync();return}
  timer=setTimeout(function(){stale=true;draw();sync()},10000);
  db.collection("board").onSnapshot(function(sn){
    rows=sn.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    loaded=true;
    if(!sn.metadata.fromCache){stale=false;if(timer){clearTimeout(timer);timer=null}
      lastAt=new Date().toISOString()}
    draw();sync();
  },function(){loaded=true;stale=true;if(timer){clearTimeout(timer);timer=null}draw();sync()});
  db.collection("agents").onSnapshot(function(sn){
    agents=sn.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    agLoaded=true;draw();
  },function(){agLoaded=true;draw()});
  db.collection("docs").onSnapshot(function(sn){
    rec.docs=sn.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    draw();if(view==="rec")drawRec()},function(){if(!rec.docs)rec.docs=[];if(view==="rec")drawRec()});
  db.doc("meta/watch").onSnapshot(function(sn){watch=sn.exists?sn.data():null;draw()},function(){});
}).catch(function(){loaded=true;agLoaded=true;stale=true;draw();sync()});
})();
</script>
